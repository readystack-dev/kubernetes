      "why": "CVE-2026-78661 / GO-2026-6860 (HIGH, published 2026-10-27): golang.org/x/net below 0.62.0 is in the vulnerable range; fixed in 0.62.0 (its go.mod needs go 1.26.0 and moves x/crypto to 0.58.0, x/sys 0.49.0, x/term 0.47.0, x/text 0.43.0). v1.37.2's go.mod requires 0.57.0; with this floor's previous value v0.60.0 (fleet floor since 2026-10-10, for CVE-2026-78663 and four highs fixed in 0.60.0), ReadyStack's daily scan of the live release v1.37.1-CE-ubuntu24.04-r2 (2026-11-06, scripts/scan-inventory.py: syft 1.54.1 + grype 0.120.1) found 0.60.0 in all 16 Go binaries (kube-apiserver, kube-controller-manager, kube-scheduler, kubelet, kube-proxy, kubectl, kubeadm, containerd, containerd-shim-runc-v2, ctr, runc, crictl, etcd, etcdctl, etcdutl, coredns). Mirrored in every tree of product-kits/kubernetes/build/Dockerfile.vendor."
    },
    {
