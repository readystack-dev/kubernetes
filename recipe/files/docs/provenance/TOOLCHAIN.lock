      "to": "v0.56.0",
      "why": "kubernetes v1.37.1 pins 0.54.0 and etcd 0.55.0: high fixable CVE-2026-56854/56855/78662, fixed in 0.55.0/0.56.0 (Scout, 2026-10-22). MVS moves kubernetes to 0.57.0 because x/net 0.60.0 requires it."
